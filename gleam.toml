name = "design_starter_kit_website"
version = "0.1.0"
description = "A growing library of reusable UI components and design examples, built with Gleam and Lustre."
licences = ["MIT"]
gleam = ">= 1.11.0"
target = "javascript"

[dependencies]
lustre = ">= 5.7.1 and < 6.0.0"

[dev-dependencies]
lustre_dev_tools = ">= 2.4.0 and < 2.5.0"

[tools.lustre.dev]
port = 1234

[tools.lustre.build]
no_tailwind = true

[tools.lustre.bin]
bun = "system"

[tools.lustre.html]
title = "Design Starter Kit"
lang = "en"
stylesheets = [{ href = "/styles.css" }]
